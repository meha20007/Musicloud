# ============================================================
# MusicLoud Backend - Application Configuration
# ============================================================
# HOW TO USE:
#   1. Copy this file to .env (keep .env secret, never push to GitHub)
#   2. Fill in your Supabase credentials when you have them
#   3. The app works in OFFLINE mode without cloud creds
# ============================================================

spring.application.name=musicloud-backend
server.port=${PORT:8080}

# ---- Supabase PostgreSQL Database ----
# Replace these with your real Supabase values when you have them
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/musicloud}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Supabase Project Details ----
supabase.url=${SUPABASE_URL:https://placeholder.supabase.co}
supabase.anon-key=${SUPABASE_ANON_KEY:placeholder-anon-key}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:placeholder-service-role-key}
supabase.jwt-secret=${SUPABASE_JWT_SECRET:placeholder-jwt-secret-at-least-256-bits-long-use-a-real-one}

# ---- JWT Settings ----
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- Supabase Storage ----
supabase.storage.songs-bucket=${SUPABASE_SONGS_BUCKET:songs}
supabase.storage.covers-bucket=${SUPABASE_COVERS_BUCKET:covers}

# ---- CORS (allow Swing desktop client) ----
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ---- Logging ----
logging.level.com.musicloud=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
